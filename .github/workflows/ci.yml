name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # Gating: stylua + luacheck must both pass, for real.
  #
  # stylua used to be advisory here, pending the one-time repo-wide `stylua .`
  # pass the existing style predated. That pass has landed: 105 files
  # reformatted, with the four headless suites reporting the same pass/fail
  # counts before and after, so nothing behavioural moved with it. Keeping the
  # step advisory now would only let the formatting drift straight back.
  lint:
    name: lint (stylua + luacheck)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: stylua (check)
        uses: JohnnyMorganz/stylua-action@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          version: v2.5.2
          args: --check .

      - name: Install luacheck
        run: sudo apt-get update && sudo apt-get install -y luarocks && sudo luarocks install luacheck 1.2.0

      - name: luacheck
        run: luacheck lua docs/BINDINGS.lua TESTS

  # Real gate: the headless test suite (smoke, units, menu, cwd_mode, gaps, refs).
  # lib.nvim is checked out as a sibling so the suites' own sibling-checkout
  # lookup (../lib.nvim) finds it -- filetree.nvim's command layer and several
  # features depend on it at runtime.
  #
  # refs/run.lua is fixture-based: it copies TESTS/refs/fixtures/<lang>/ to a
  # scratch dir and renames a module through the real feature, asserting every
  # referencing file follows. It needs no tree plugin and no LSP server, and
  # runs on either candidate-search path -- ripgrep when the image has it, the
  # capped fallback walk when it does not (both verified, same 54 checks).
  test:
    name: tests (headless) (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      # One platform failing must not cancel the others: which of the three
      # broke is the whole information content of this job.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        # Windows runners default to PowerShell; one shell on all three keeps
        # the run step itself from being what differs between platforms.
        shell: bash
    steps:
      - name: Checkout filetree.nvim
        uses: actions/checkout@v5
        with:
          path: filetree.nvim

      - name: Checkout lib.nvim
        uses: actions/checkout@v5
        with:
          repository: WKDSteve/lib.nvim
          path: lib.nvim
          ref: ci-verified

      # ui.nvim: filetree.refs.ui does `require("ui.kit")` unconditionally
      # at module load time (not lazy, not pcall'd -- see that file's own
      # header), and filetree.refs is itself required eagerly from
      # filetree.setup(). So the very first setup() call in ANY of the six
      # suites below needs ui.nvim resolvable, and TESTS/*.lua's own
      # candidate search already expects a sibling checkout here -- this
      # step was simply missing, which is why every suite that calls
      # setup() failed on a real `ui.kit` load error, and every later
      # setup() call in the same nvim process then hit Lua's cached
      # "loop or previous error loading module" instead of that real one.
      - name: Checkout ui.nvim
        uses: actions/checkout@v5
        with:
          repository: WKDSteve/ui.nvim
          path: ui.nvim
          ref: ci-verified

      # The test sheet TESTS/sheets/diag-badges-neotree.sheet.lua runs a real neo-tree in its child
      # editor (TESTS/minimal_init_sheet_neotree.lua finds these as siblings). Pinned: the sheet's
      # screen snapshots were taken with exactly these commits.
      - name: Checkout neo-tree.nvim (pinned)
        uses: actions/checkout@v5
        with:
          repository: nvim-neo-tree/neo-tree.nvim
          path: neo-tree.nvim
          ref: 1a14083046d96e88e361d1da00761c40d45012f3
      - name: Checkout nui.nvim (pinned)
        uses: actions/checkout@v5
        with:
          repository: MunifTanjim/nui.nvim
          path: nui.nvim
          ref: 10fc361835c856ba4233ef5ea135b919bf3dce97
      - name: Checkout plenary.nvim (pinned)
        uses: actions/checkout@v5
        with:
          repository: nvim-lua/plenary.nvim
          path: plenary.nvim
          ref: 74b06c6c75e4eeb3108ec01852001636d85a932b

      - name: Install Neovim (stable)
        uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: stable

      # Checked out from the branch that only moves once the dependency's own CI is green.
      - uses: actions/checkout@v5
        with:
          repository: "WKDSteve/testing.nvim"
          path: testing.nvim
          ref: ci-verified
      - name: Run test suites
        working-directory: filetree.nvim
        run: |
          exec > >(tee -a "$RUNNER_TEMP/test-output.log") 2>&1
          set -e
          bash scripts/test.sh --json "$RUNNER_TEMP/testing-ir.json"
      - name: Conformance gate
        working-directory: filetree.nvim
        run: bash scripts/test.sh conformance
      # The IR is what a reporter or a person reads to find out WHICH case failed on WHICH platform.
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: testing-ir-${{ matrix.os }}
          path: ${{ runner.temp }}/testing-ir.json
          if-no-files-found: ignore
          retention-days: 14

      # The FEATURE REFERENCE section of doc/filetree.txt is generated from
      # docs/FEATURES/*.md and the binding catalog. Without this gate it would
      # go stale the same way it did before it existed -- a new feature ships,
      # `:help filetree-<it>` resolves to nothing, and nobody notices until
      # somebody goes looking. Lives here rather than in the lint job because
      # it loads the plugin, so it needs the lib.nvim checkout.
      - name: doc/filetree.txt is in step with docs/FEATURES
        working-directory: filetree.nvim
        run: |
          exec > >(tee -a "$RUNNER_TEMP/test-output.log") 2>&1
          nvim -n --clean --headless -u NONE -l scripts/gen_vimdoc_reference.lua --check
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: test-output-test-${{ matrix.os }}
          path: ${{ runner.temp }}/test-output.log
          if-no-files-found: ignore
          retention-days: 14
